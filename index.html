<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>BookSwap</title>
</head>
<body class="bg-[#F3F6FE]">
    <header class="m-8">
        <h1 class="text-4xl">Demande d'échange de livres</h1>
        <h2 class="text-2xl">Consulte les propositions d'échange de livres entre apprenants</h2>
        <p>6 demandes trouvées</p>
    </header>
    <main class="m-8">
        <section>
            <form>
                <label for="fname">Rechercher</label><br>
                <input class="border rounded-lg" type="text" id="recherche" name="recherche">
                <input type="submit" value="Actualiser">
            </form>
        </section>
        <section>
            <div id="exchanges" class="grid grid-cols-2 gap-4">
                

            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
